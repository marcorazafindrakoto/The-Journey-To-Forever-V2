<?xml version="1.0" encoding="UTF-8"?>

<svg
xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 600 400">

<defs>

<linearGradient id="bodyGradient"

x1="0"

y1="0"

x2="0"

y2="1">

<stop offset="0%" stop-color="#FBF8F3"/>

<stop offset="100%" stop-color="#E7D4BC"/>

</linearGradient>

<linearGradient id="leftFold"

x1="0"

y1="0"

x2="1"

y2="1">

<stop offset="0%" stop-color="#FCFAF7"/>

<stop offset="100%" stop-color="#E8D6BF"/>

</linearGradient>

<linearGradient id="rightFold"

x1="1"

y1="0"

x2="0"

y2="1">

<stop offset="0%" stop-color="#FCFAF7"/>

<stop offset="100%" stop-color="#E8D6BF"/>

</linearGradient>

<linearGradient id="bottomFold"

x1="0"

y1="0"

x2="0"

y2="1">

<stop offset="0%" stop-color="#F3E7D7"/>

<stop offset="100%" stop-color="#DFC8AA"/>

</linearGradient>

<filter id="shadow">

<feDropShadow

dx="0"

dy="18"

stdDeviation="18"

flood-opacity=".18"/>

</filter>

</defs>

<rect

x="70"

y="110"

width="460"

height="230"

rx="12"

fill="url(#bodyGradient)"

filter="url(#shadow)"/>

<path

d="M70 110 L300 230 L70 340 Z"

fill="url(#leftFold)"/>

<path

d="M530 110 L300 230 L530 340 Z"

fill="url(#rightFold)"/>

<path

d="M70 340 L300 180 L530 340 Z"

fill="url(#bottomFold)"/>

<path

d="M70 110 L300 230"

stroke="#FFFFFF"

stroke-opacity=".45"

stroke-width="2"/>

<path

d="M530 110 L300 230"

stroke="#FFFFFF"

stroke-opacity=".45"

stroke-width="2"/>

<path

d="M300 180 L300 230"

stroke="#BFA07C"

stroke-opacity=".5"

stroke-width="1"/>

</svg>