<?xml version="1.0" encoding="UTF-8"?>

<svg
xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 600 400">

<defs>

<linearGradient
id="flapGradient"
x1="0"
y1="0"
x2="0"
y2="1">

<stop
offset="0%"
stop-color="#FCFAF7"/>

<stop
offset="100%"
stop-color="#E7D4BC"/>

</linearGradient>

<linearGradient
id="shine"
x1="0"
y1="0"
x2="1"
y2="1">

<stop
offset="0%"
stop-color="#FFFFFF"
stop-opacity=".55"/>

<stop
offset="100%"
stop-color="#FFFFFF"
stop-opacity="0"/>

</linearGradient>

</defs>

<!-- TOP FLAP -->

<path

id="topFlap"

d="

M70 110

L530 110

L300 285

Z

"

fill="url(#flapGradient)"/>

<!-- CENTER FOLD -->

<path

d="

M300 110

L300 285

"

stroke="#D8C3A6"

stroke-width="1"

stroke-opacity=".45"/>

<!-- HIGHLIGHT -->

<path

d="

M95 125

L300 255

L505 125

"

fill="none"

stroke="#FFFFFF"

stroke-width="2"

stroke-opacity=".35"/>

<!-- BORDER -->

<path

d="

M70 110

L300 285

L530 110

"

fill="none"

stroke="#E0CDB7"

stroke-width="1"

stroke-opacity=".6"/>

</svg>